version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    image: laravel-app
    container_name: laravel-app
    restart: unless-stopped
    volumes:
      - ../:/var/www
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    command: --ssl=0 --skip-ssl
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao_de_viagens
      MYSQL_USER: gestao_de_viagens
      MYSQL_PASSWORD: gestao_de_viagens
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - laravel

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: laravel-worker
    container_name: laravel-worker
    restart: unless-stopped
    depends_on:
      - db
      - app
    volumes:
      - ../:/var/www
    working_dir: /var/www
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - QUEUE_CONNECTION=database
      - APP_ENV=local
      - APP_DEBUG=true
    command: ["php", "/var/www/artisan", "queue:work", "--queue=high,emails", "--tries=3", "--timeout=90", "--memory=512"]
    networks:
      - laravel

networks:
  laravel:

volumes:
  db_data:
